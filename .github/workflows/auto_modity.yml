name: Update wy.js Plugin

on:
  repository_dispatch:
    types: [check_for_updates]
  workflow_dispatch:
  schedule:
    # 每3天运行一次
    - cron: '0 0 */3 * *'

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check-version.outputs.has_update }}
      upstream_version: ${{ steps.check-version.outputs.upstream_version }}
      current_version: ${{ steps.check-version.outputs.current_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check upstream and current plugin version
        id: check-version
        run: |
          # 安装依赖
          sudo apt-get update
          sudo apt-get install -y jq curl
          
          # 下载上游插件文件
          curl -s -o upstream_wy.js "https://ghproxy.cn/raw.githubusercontent.com/ThomasBy2025/musicfree/main/plugins/wy.js"
          
          # 使用 Node.js 提取版本号
          UPSTREAM_VERSION=$(node -e "
          try {
            const fs = require('fs');
            const content = fs.readFileSync('upstream_wy.js', 'utf-8');
            const versionMatch = content.match(/version\s*:\s*['\"]([^'\"]+)['\"]/);
            if (versionMatch && versionMatch[1]) {
              console.log(versionMatch[1]);
            } else {
              console.log('unknown');
            }
          } catch (e) {
            console.log('error');
          }
          ")
          
          # 动态获取当前插件版本号
          CURRENT_VERSION=$(node -e "
          try {
            const fs = require('fs');
            const content = fs.readFileSync('plugins/wy.js', 'utf-8');
            const versionMatch = content.match(/version\s*:\s*['\"]([^'\"]+)['\"]/);
            if (versionMatch && versionMatch[1]) {
              console.log(versionMatch[1]);
            } else {
              console.log('unknown');
            }
          } catch (e) {
            console.log('error');
          }
          ")
          
          echo "上游版本: $UPSTREAM_VERSION"
          echo "当前版本: $CURRENT_VERSION"
          
          # 比较版本号
          if [ "$UPSTREAM_VERSION" != "$CURRENT_VERSION" ] && [ "$UPSTREAM_VERSION" != "unknown" ] && [ "$UPSTREAM_VERSION" != "error" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "上游版本更新，需要更新插件"
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "版本相同，无需更新"
          fi
          
          echo "upstream_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # 保存版本信息供后续使用
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> $GITHUB_ENV
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

  update-plugin:
    needs: check-upstream
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.check-upstream.outputs.has_update == 'true' && github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq
          
      - name: Download wy.js
        run: |
          # 使用 wget 下载文件
          wget -O wy.js "https://ghproxy.cn/raw.githubusercontent.com/ThomasBy2025/musicfree/main/plugins/wy.js"
          
          # 验证下载结果
          if [ ! -f wy.js ]; then
            echo "::error::wy.js 文件下载失败"
            exit 1
          fi
          
          if [ ! -s wy.js ]; then
            echo "::error::下载的 wy.js 文件为空"
            exit 1
          fi
          
          echo "wy.js 下载成功，大小: $(wc -c <wy.js) 字节"

      - name: Download function definitions
        run: |
          # 使用新的 URL 下载函数定义文件
          wget -O getLyric.txt "https://ghproxy.cn/raw.githubusercontent.com/Lmlanmei64/MusicFreePlugins/master/getLyric.txt"
          wget -O getMusicComments.txt "https://ghproxy.cn/raw.githubusercontent.com/Lmlanmei64/MusicFreePlugins/master/getMusicComments.txt"
          
          # 验证下载结果
          for file in getLyric.txt getMusicComments.txt; do
            if [ ! -f "$file" ]; then
              echo "::error::$file 下载失败"
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "::error::$file 文件为空"
              exit 1
            fi
            echo "$file 下载成功，大小: $(wc -c <"$file") 字节"
          done

      - name: Create and run Node.js replacement script
        run: |
          # 创建并直接运行 Node.js 替换脚本
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          // 读取源文件和函数定义
          const sourceFile = fs.readFileSync('wy.js', 'utf-8');
          const getLyricCode = fs.readFileSync('getLyric.txt', 'utf-8');
          const getMusicCommentsCode = fs.readFileSync('getMusicComments.txt', 'utf-8');
          
          // 查找 axios 变量名
          const axiosRegex = /const\s+(\w+)\s*=\s*require\s*\(\s*['"]axios['"]\s*\)/;
          const axiosMatch = sourceFile.match(axiosRegex);
          const axiosVar = axiosMatch ? axiosMatch[1] : 'axios';
          console.log(`检测到axios变量名: ${axiosVar}`);
          
          // 定义替换函数
          function replaceFunction(source, funcName, newCode) {
            // 构建匹配函数签名的正则表达式
            const signaturePattern = new RegExp(
              `(async\\s+)?function\\s+${funcName}\\s*\\([^)]*\\)\\s*\\{[\\s\\S]*?\\n\\}`,
              'g'
            );
            
            // 尝试匹配原始函数
            const matches = source.match(signaturePattern);
            if (!matches || matches.length === 0) {
              console.error(`未找到函数: ${funcName}`);
              return source;
            }
            
            // 替换函数中的 axios 变量名
            const adjustedCode = newCode.replace(/axios/g, axiosVar);
            
            // 替换所有匹配项
            return source.replace(signaturePattern, adjustedCode);
          }
          
          // 执行所有替换
          let modifiedContent = sourceFile;
          modifiedContent = replaceFunction(modifiedContent, 'getLyric', getLyricCode);
          modifiedContent = replaceFunction(modifiedContent, 'getMusicComments', getMusicCommentsCode);
          
          // 替换 appVersion
          const appVersionRegex = /(appVersion\s*:\s*)(['"][^'"]*['"])/;
          if (appVersionRegex.test(modifiedContent)) {
            modifiedContent = modifiedContent.replace(appVersionRegex, '$1">0.2.0-alpha"');
            console.log('appVersion 替换成功');
          } else {
            console.warn('未找到 appVersion，已跳过替换');
          }
          
          // 修改 description 内容
          const descRegex = /(description\s*:\s*['"])([\s\S]*?)(['"])/;
          if (descRegex.test(modifiedContent)) {
            let desc = modifiedContent.match(descRegex)[2];
            
            // 修改 "By: Thomas喲" 为 "原插件 By: Thomas喲\n此修改版插件 By:Lm_蓝莓"
            desc = desc.replace("By: Thomas喲", "原插件 By: Thomas喲\n此修改版插件 By:Lm_蓝莓");
            
            // 在 "修复酷我渠道，增加解析" 后添加指定内容
            desc = desc.replace("修复酷我渠道，增加解析", "修复酷我渠道，增加解析（此修改版修改了歌词和评论获取api）");
            
            modifiedContent = modifiedContent.replace(descRegex, `$1${desc}$3`);
            console.log('description 修改成功');
          } else {
            console.warn('未找到 description，已跳过替换');
          }
          
          // 写入修改后的文件
          fs.writeFileSync('wy_modified.js', modifiedContent);
          console.log('函数替换完成');
          EOF
          
          # 验证替换结果
          if [ ! -f wy_modified.js ]; then
            echo "::error::修改后的文件未生成"
            exit 1
          fi
          
          if [ ! -s wy_modified.js ]; then
            echo "::error::修改后的文件为空"
            exit 1
          fi
          
          # 检查替换后的函数是否正确
          if ! grep -q "async function getLyric(musicItem) {" wy_modified.js; then
            echo "::error::getLyric函数替换失败"
            exit 1
          fi
          
          # 检查 appVersion 是否替换成功
          if ! grep -q 'appVersion: ">0.2.0-alpha"' wy_modified.js; then
            echo "::warning::appVersion 替换失败或未找到"
          fi
          
          # 检查 description 是否修改成功
          if ! grep -q '此修改版插件 By:Lm_蓝莓' wy_modified.js; then
            echo "::warning::description 修改失败"
          fi
          
          mv wy_modified.js wy.js
          echo "函数替换成功，新文件大小: $(wc -c <wy.js) 字节"

  - name: Replace srcUrl
  run: |
    # 设置新的 srcUrl
    new_srcUrl="https://raw.jgithub.xyz/LmLanmei64/MusicFreePlugins/master/plugins/wy.js"
    
    # 创建替换脚本文件
    cat > replace-srcurl.js << 'EOF'
    const fs = require('fs');
    const newSrcUrl = "$new_srcUrl";
    
    const content = fs.readFileSync('wy.js', 'utf-8');
    const newContent = content.replace(/(srcUrl:\s*['"])([^'"]+)(['"])/, `$1${newSrcUrl}$3`);
    
    fs.writeFileSync('wy.js', newContent);
    console.log('srcUrl 替换完成，新URL:', newSrcUrl);
    EOF
    
    # 替换变量占位符
    sed -i "s|\$new_srcUrl|${new_srcUrl}|g" replace-srcurl.js
    
    # 运行替换脚本
    node replace-srcurl.js
    
    # 验证替换结果
    if grep -q "$new_srcUrl" wy.js; then
      echo "srcUrl 替换成功"
    else
      echo "::error::srcUrl 替换失败"
      exit 1
    fi

      - name: Upload modified file
        run: |
          mkdir -p plugins
          mv wy.js plugins/
          echo "文件已移动到 plugins/ 目录"

      - name: Force commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          
          # 强制添加文件
          git add -f plugins/wy.js
          
          # 根据更新状态设置提交信息
          if [ "${{ needs.check-upstream.outputs.has_update }}" = "true" ]; then
            COMMIT_MSG="chore: update wy.js plugin from ${{ needs.check-upstream.outputs.current_version }} to ${{ needs.check-upstream.outputs.upstream_version }}"
          else
            COMMIT_MSG="chore: manual update wy.js plugin (version: ${{ needs.check-upstream.outputs.current_version }})"
          fi
          
          git commit --allow-empty -m "$COMMIT_MSG [skip ci]"
          git push