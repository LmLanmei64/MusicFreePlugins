name: Cleanup Workflow Runs

on:
  # 每周日 00:00 自动运行
  schedule:
    - cron: '0 0 * * 0'
  # 允许手动触发
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs for this repository
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7        # 保留最近7天的记录
          keep_minimum_runs: 10  # 至少保留10条最近的记录
